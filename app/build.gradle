plugins {
    id 'com.android.application'
}

android {
    namespace 'com.copperbars.offlinewhatsapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.copperbars.offlinewhatsapp'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
